name: Release notes
on:
  push:
    tags:
      - "*"
jobs:
  create-shasums:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b
